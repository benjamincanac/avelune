allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

# `vue` stays a direct dependency. The app imports it directly, and Nuxt lists
# it as a required package (`nuxt dev` warns NUXT_B5010 without it), even though
# its `vue` alias lets the build and dev server work without one.
#
# The nightlies are younger than pnpm's minimum release age. The excludes can go
# once they have aged.
minimumReleaseAgeExclude:
  - '@nuxt/cli-nightly@4.1.0-2611250955-3e3cd15'
  - '@nuxt/kit-nightly@5.0.0-2611251001-c21a73c'
  - '@nuxt/nitro-server-nightly@5.0.0-2611251001-c21a73c'
  - '@nuxt/schema-nightly@5.0.0-2611251001-c21a73c'
  - '@nuxt/vite-builder-nightly@5.0.0-2611251001-c21a73c'
  - '@nuxt/vite-server-nightly@5.0.0-2611251001-c21a73c'
  - nitro@3.0.261103-rc
  - nuxt-nightly@5.0.0-2611251001-c21a73c
