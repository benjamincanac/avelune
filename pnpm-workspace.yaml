allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

# `vue` must stay a direct dependency. Nuxt sets `resolve.dedupe: ['vue']` and
# its lazy component wrappers import bare `vue`, both resolved from the project
# root, and under pnpm there is no root `node_modules/vue` unless it is listed
# (nuxt/nuxt#36785 fixes the wrappers).
#
# The nightlies are younger than pnpm's minimum release age. The excludes can go
# once they have aged.
minimumReleaseAgeExclude:
  - '@nuxt/cli-nightly@4.0.1-2610292127-cd8f364'
  - '@nuxt/kit-nightly@5.0.0-2610292252-da55a91'
  - '@nuxt/nitro-server-nightly@5.0.0-2610292252-da55a91'
  - '@nuxt/schema-nightly@5.0.0-2610292252-da55a91'
  - '@nuxt/vite-builder-nightly@5.0.0-2610292252-da55a91'
  - '@nuxt/vite-server-nightly@5.0.0-2610292252-da55a91'
  - nitro@3.0.261029-rc
  - nuxt-nightly@5.0.0-2610292252-da55a91
