allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

minimumReleaseAge: 2880

# Pin the whole tree (incl. @nuxt/nitro-server-nightly, which pins
# ^3.0.260522-beta) onto the Nitro build that ships native Vercel WebSocket
# support via crossws/adapters/vercel. Prerelease semver means the caret range
# won't pick this up on its own.
#
# Do not move to 3.0.260903-beta yet: it needs a Nuxt 5 nightly >= 29814795
# (older ones import a removed `writeTypes` builder export), and those nightlies
# mount Nitro as a Vite environment whose dev hook does
# `server.httpServer.on("upgrade")` while Nuxt runs Vite in middleware mode
# (httpServer is null), so `nuxt dev` crashes and dev WebSockets have no
# upgrade path. Prod builds were fine. Revisit when Nuxt forwards upgrades.
overrides:
  nitro: 3.0.260610-beta
