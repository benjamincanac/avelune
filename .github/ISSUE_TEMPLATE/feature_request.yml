name: "Feature Request"
description: Suggest an improvement to Avelune
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see in Avelune?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you implement it? (optional)
    validations:
      required: false
